name: Tests

on:
  push:
    # Candidate push tests github.sha itself before main/tag publication.
    branches: [ main, develop, 'release-candidate/**' ]
  pull_request:
    branches: [ main ]

jobs:
  release-workflow:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Require inert release failure-path regressions
      run: |
        bash -n taskfile
        python3 tools/quality/test_release.py
        python3 tools/quality/test_manual_release.py

  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.26.0"
        check-latest: true
        cache-dependency-path: go.sum

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Get dependencies
      run: |
        export GOTOOLCHAIN=local
        go mod download

    - name: Require simultaneous v2, v3 and HTTPRouter contracts
      run: |
        go test -mod=readonly . -list '^TestAdapterCompatibilityMatrix$' | grep -qx TestAdapterCompatibilityMatrix
        go test -mod=readonly -v . -run '^TestAdapterCompatibilityMatrix$' -count=1

    - name: Require live lifecycle and SSE cleanup
      run: |
        go test -mod=readonly -v . -run '^TestServerLifecycle|^TestFiberV3ServeListenConfigAndNativeStartup|^TestFiberV3WebSocketMiddlewareSnapshotAndOwnedShutdown' -count=1
        go test -mod=readonly -v ./ssefiber -run '^TestMountLiveBackendReplayHeartbeatAndCleanup$' -count=1

    - name: Require migration defect regressions
      run: |
        go test -mod=readonly . -list '^Test(FiberV3NativeMiddleware|FiberV3WebSocketDetached|FiberV3Snapshot|DualFiberViewAutoescape|FiberViewNestedEngineComposition|FiberV3ViewCachedExecutionState|FiberV3CachedHTTPRequest|FiberV3HTTPBridge|FiberV3DirectHTTP|FiberV3ViewForeign|FiberV3ViewNative|FiberV3ViewScoped|FiberV3ViewFunctionOverrides|FiberV3Legacy|FiberV3ViewExtensionConfigurationErrors|FiberV3HTTPCached|FiberV3ViewFilterResultBoundary|FiberV3ViewTransitiveMethodBoundary|FiberV3ViewClosedMethodGraph)' > /tmp/migration-regressions
        for name in TestFiberV3NativeMiddlewareResponseState TestFiberV3NativeMiddlewareStateBeforeNextAndNestedUnwind TestFiberV3WebSocketDetachedMiddlewareState TestFiberV3SnapshotRawHeadersAndLocalOwnership TestDualFiberViewAutoescapeIsolation TestFiberViewNestedEngineComposition TestFiberV3ViewCachedExecutionState TestFiberV3CachedHTTPRequestFollowsContextReplacement TestFiberV3HTTPBridgeResponseState TestFiberV3DirectHTTPWriterUpdatesState TestFiberV3ViewForeignValuesFailClosed TestFiberV3ViewNativeValuesAndHelpers TestFiberV3ViewForeignValueHTTP TestFiberV3ViewScopedExtensions TestFiberV3ViewFunctionOverrides TestFiberV3LegacyViewExtensions TestFiberV3LegacyHelperValues TestFiberV3ViewExtensionConfigurationErrors TestFiberV3HTTPBridgeEmptyHeadAndCookies TestFiberV3HTTPCachedRequestContextReplacement TestFiberV3ViewFilterResultBoundary TestFiberV3ViewTransitiveMethodBoundary TestFiberV3ViewClosedMethodGraph; do
          grep -Fxq "$name" /tmp/migration-regressions || exit 1
        done

    - name: Run tests
      run: |
        export GOTOOLCHAIN=local
        go test -mod=readonly -v ./...

    - name: Run tests with race detector
      run: |
        export GOTOOLCHAIN=local
        go test -mod=readonly -race -v ./...

    - name: Run vet
      run: |
        export GOTOOLCHAIN=local
        go vet -mod=readonly ./...

    - name: Check formatting
      run: |
        export GOTOOLCHAIN=local
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          exit 1
        fi

  sseclient:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: sseclient/package-lock.json

    - name: Verify version sync
      run: |
        ROOT_VERSION=$(cat .version)
        SSE_VERSION=$(node -p "require('./sseclient/package.json').version")
        WS_VERSION=$(node -p "require('./client/package.json').version")
        HANDLER_VERSION=$(sed -n 's/^[[:space:]]*WebSocketClientVersion = "\([^"]*\)".*/\1/p' websocket_client_handlers.go | head -n 1)

        test "$ROOT_VERSION" = "$SSE_VERSION"
        test "$ROOT_VERSION" = "$WS_VERSION"
        test "$ROOT_VERSION" = "$HANDLER_VERSION"

    - name: Install SSE client dependencies
      working-directory: sseclient
      run: npm ci

    - name: Run SSE client tests
      working-directory: sseclient
      run: npm test

    - name: Build SSE client
      working-directory: sseclient
      run: npm run build

  nested-module-discovery:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - id: discover
      name: Require an explicit CI entry for every active nested Go module
      run: |
        MODULES=$(python3 tools/quality/nested_modules.py)
        echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

  nested-modules:
    needs: nested-module-discovery
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.nested-module-discovery.outputs.modules) }}
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - name: Set up minimum Go toolchain
      uses: actions/setup-go@v6
      with:
        # The protected consumer has its own higher published-provider minimum.
        go-version: ${{ matrix.module == 'integration/bounded-ingress' && '1.26.5' || '1.26.0' }}
        check-latest: false
        cache-dependency-path: |
          go.sum
          ${{ matrix.module }}/go.sum
    # WebSocket examples retain published pins; bounded-ingress replaces the router.
    - name: Test each module's declared dependency graph
      working-directory: ${{ matrix.module }}
      run: go test -mod=readonly ./...
